[backdrop]
enabled = true
tint_intensity = 0.4999999888241291

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    center = [ "media", "clock", "weather" ]
    end = [ "keyboard_layout", "group:g7" ]
    font_family = "SF Pro"
    margin_edge = 0
    margin_ends = 0
    padding = 4
    radius = 40
    radius_bottom_left = -16
    radius_bottom_right = -16
    start = [ "workspaces", "group:g6" ]
    widget_spacing = 8

        [[bar.default.capsule_group]]
        fill = "surface_variant"
        id = "g1"
        members = [ "clock", "bongocat" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        fill = "surface_variant"
        id = "g3"
        members = [ "keyboard_layout", "volume", "screen_recorder", "bluetooth", "wallpaper", "control-center" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        fill = "primary"
        foreground = "on_primary"
        id = "g4"
        members = [ "launcher", "clock", "bongocat" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        fill = "primary"
        foreground = "on_secondary"
        id = "g2"
        members = [ "tray", "volume", "bluetooth", "wallpaper", "notifications", "control-center" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        fill = "secondary"
        foreground = "on_secondary"
        id = "g5"
        members = [ "cpu", "ram" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        fill = "surface_variant"
        id = "g7"
        members = [ "tray", "recorder", "bluetooth", "volume", "notifications", "control-center" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        fill = "surface_variant"
        id = "g6"
        members = [ "temp", "cpu", "ram" ]
        opacity = 1.0
        padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/headset_dev_B0_38_E2_5A_C9_EE"]
warning_threshold = 30

[brightness]
enable_ddcutil = true

[control_center]
sidebar = "none"
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "screen_time"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "nightlight"

[desktop_widgets]
schema_version = 1
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
background_opacity = 0.99999997764825821
enabled = true
radius = 80
reserve_space = false

[keybinds]
validate = [ "Return", "KP_Enter" ]

[location]
address = "Samsun, Turkey"

[lockscreen_widgets]
enabled = true
schema_version = 1
widget_order = [ "lockscreen-login-box@WAYLAND-1", "lockscreen-login-box@DP-2", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 540.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 320.0
    cy = 241.0
    output = "WAYLAND-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 128.0
    box_width = 256.0
    cx = 960.0
    cy = 348.0
    output = "DP-2"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = true
        background_opacity = 0.77000000000000002
        background_padding = 14.0
        background_radius = 24.0
        color = "tertiary"
        shadow = false

[notification]
position = "top_center"

[osd]
background_opacity = 0.99999997764825821

    [osd.kinds]
    media = false

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
app_icon_color = "primary"
avatar_path = "/home/elrond/Saved/mojelrond.png"
corner_radius_scale = 2.0
font_family = "SF Pro"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true
ui_scale = 1.2000000104308128

    [shell.animation]
    speed = 0.60000000894069672

    [shell.launcher]
    categories = false
    session_search = true
    sort_by_usage = false

    [shell.panel]
    launcher_categories = false
    launcher_session_search = true
    open_near_click_control_center = true

    [shell.screen_corners]
    enabled = true

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Gruvbox"
community_palette = "GitHub Dark"
custom_palette = "blocksmiths"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "niri" ]
    community_ids = [ "yazi" ]

[wallpaper]
directory = "/home/elrond/Pictures/Wallpapers"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]

    [wallpaper.default]
    path = "/home/elrond/Pictures/Wallpapers/wallhaven-je5wl5_1920x1080.png"

    [wallpaper.last]
    path = "/home/elrond/Pictures/Wallpapers/wallhaven-je5wl5_1920x1080.png"

    [wallpaper.monitors.DP-2]
    path = "/home/elrond/Pictures/Wallpapers/wallhaven-je5wl5_1920x1080.png"

[weather]
address = "Samsun, Turkey"

[widget.bongocat]
input_device = ""
scope = "shared"
script = "scripts/bongocat.lua"
type = "scripted"

[widget.clock]
anchor = true
color = "primary"
format = "{:%a %d, %H:%M}"

[widget.control-center]
color = "primary"

[widget.cpu]
display = "text"

[widget.media]
color = "primary"
max_length = 160
title_scroll = "on_hover"

[widget.network]
capsule = true

[widget.notifications]
color = "secondary"

[widget.ram]
display = "text"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.screen_recorder]
script = "scripts/screen_recorder.lua"
type = "scripted"

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.weather]
color = "primary"

[widget.workspaces]
capsule = true